<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Video Viewer - Panolens</title>
    
    <!-- Memuat Three.js dan Panolens -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/105/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/panolens@0.12.1/build/panolens.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        
        /* Container untuk Video 360 */
        #pano-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* UI Styling */
        #open-menu-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10000;
            background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 15px;
            border-radius: 6px; border: 1px solid #444; cursor: pointer;
            font-weight: bold; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #ui-container {
            position: absolute; top: 20px; left: 20px; z-index: 9999;
            background: rgba(0, 0, 0, 0.85); color: white; padding: 15px;
            border-radius: 8px; display: flex; flex-direction: column; gap: 10px;
            width: 320px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;
            transition: opacity 0.3s;
        }
        
        .control-group { border: 1px solid #555; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
        input, button { padding: 8px; border-radius: 4px; border: none; font-family: inherit; }
        input[type="file"] { background: white; color: black; }
        input[type="url"] { background: #fff; color: #000; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-toggle { background: #28a745; }
        .btn-toggle.off { background: #dc3545; }
        .btn-toggle:hover { filter: brightness(1.2); }
        .btn-hide { background: #343a40; margin-top: 5px; border: 1px solid #666; }
        .btn-hide:hover { background: #23272b; }
        small { color: #ccc; font-size: 11px; line-height: 1.4; }
        
        #crosshair-info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: yellow; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 9999; display: none; pointer-events: none; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;
        }
    </style>
</head>
<body>

    <button id="open-menu-btn">☰ Buka Menu</button>

    <div id="ui-container">
        <div class="control-group">
            <label>1. Sumber Video:</label>
            <input type="file" id="file-upload" accept="video/mp4,video/webm,video/mov">
            <input type="url" id="url-input" placeholder="URL Video (Support CORS)">
            <button id="load-btn">Muat Video</button>
        </div>

        <div class="control-group">
            <label>2. Kontrol Player:</label>
            <button id="loop-btn" class="btn-toggle">🔁 Looping: ON</button>
        </div>

        <div class="control-group">
            <label>3. Anotasi 3D:</label>
            <button id="annot-btn" class="btn-toggle off">📍 Mode Anotasi: OFF</button>
            <small>*Bila ON, klik bagian mana saja pada video untuk menambahkan anotasi melayang.</small>
        </div>
        
        <button id="clear-annot-btn" style="background: #6c757d;">Hapus Semua Anotasi</button>
        <button id="hide-menu-btn" class="btn-hide">👁️ Sembunyikan Menu</button>
    </div>

    <div id="crosshair-info">Klik area video untuk menambah anotasi!</div>

    <!-- Div Utama untuk Panolens -->
    <div id="pano-container"></div>

    <script>
        // DOM Elements
        const fileUpload = document.getElementById('file-upload');
        const urlInput = document.getElementById('url-input');
        const loadBtn = document.getElementById('load-btn');
        const loopBtn = document.getElementById('loop-btn');
        const annotBtn = document.getElementById('annot-btn');
        const clearAnnotBtn = document.getElementById('clear-annot-btn');
        const hideMenuBtn = document.getElementById('hide-menu-btn');
        const openMenuBtn = document.getElementById('open-menu-btn');
        const uiContainer = document.getElementById('ui-container');
        const crosshairInfo = document.getElementById('crosshair-info');
        const panoContainer = document.getElementById('pano-container');

        let isAnnotMode = false;
        let currentPanorama = null;
        let infospots = [];

        // Inisialisasi Panolens Viewer
        const viewer = new PANOLENS.Viewer({
            container: panoContainer,
            controlBar: false, // Mematikan tombol kontrol bawaan bawah layar
            cameraFov: 60      // FOV di-set ke 60 untuk mencegah stretch distorsi di pinggir layar
        });

        // Toggle UI Menu
        hideMenuBtn.addEventListener('click', () => {
            uiContainer.style.display = 'none';
            openMenuBtn.style.display = 'block';
        });

        openMenuBtn.addEventListener('click', () => {
            uiContainer.style.display = 'flex';
            openMenuBtn.style.display = 'none';
        });

        // Fungsi Load Video
        loadBtn.addEventListener('click', () => {
            let videoUrl = '';
            if (fileUpload.files.length > 0) {
                videoUrl = URL.createObjectURL(fileUpload.files[0]);
            } else if (urlInput.value.trim() !== '') {
                videoUrl = urlInput.value;
            } else {
                alert('Pilih file atau masukkan URL video!');
                return;
            }

            // Hapus panorama sebelumnya jika ada
            if (currentPanorama) {
                viewer.remove(currentPanorama);
                currentPanorama.dispose();
                infospots = [];
            }

            // Memuat video baru menggunakan Panolens
            currentPanorama = new PANOLENS.VideoPanorama(videoUrl, {
                autoplay: true,
                loop: true,
                muted: false // Atur ke true jika browser Anda memblokir autoplay suara
            });

            viewer.add(currentPanorama);
            viewer.setPanorama(currentPanorama);

            // Set tombol looping ke default (ON)
            loopBtn.innerText = "🔁 Looping: ON";
            loopBtn.className = "btn-toggle";

            // Event untuk menambahkan anotasi pada klik/tap
            currentPanorama.addEventListener('click', (event) => {
                if (!isAnnotMode || !event.intersects || event.intersects.length === 0) return;

                // Ambil kordinat 3D yang diklik
                const point = event.intersects[0].point;
                const textInput = prompt("Masukkan teks anotasi:");
                if (!textInput) return;

                // Buat Infospot (Anotasi bawaan Panolens)
                // Angka 300 adalah ukuran dari ikon infospot
                const infospot = new PANOLENS.Infospot(300, PANOLENS.DataImage.Info);
                infospot.position.copy(point);
                infospot.addHoverText(textInput);
                
                // Supaya teks langsung terlihat tanpa harus di-hover (opsional)
                infospot.show();

                currentPanorama.add(infospot);
                infospots.push(infospot);

                // Matikan mode anotasi otomatis setelah 1x klik
                isAnnotMode = false;
                annotBtn.innerText = "📍 Mode Anotasi: OFF";
                annotBtn.className = "btn-toggle off";
                crosshairInfo.style.display = "none";
            });
        });

        // Toggle Looping
        loopBtn.addEventListener('click', () => {
            if (!currentPanorama) return;
            const videoEl = currentPanorama.getVideoElement();
            
            videoEl.loop = !videoEl.loop;
            if (videoEl.loop) {
                loopBtn.innerText = "🔁 Looping: ON";
                loopBtn.className = "btn-toggle";
            } else {
                loopBtn.innerText = "🔁 Looping: OFF";
                loopBtn.className = "btn-toggle off";
            }
        });

        // Toggle Mode Anotasi
        annotBtn.addEventListener('click', () => {
            isAnnotMode = !isAnnotMode;
            if (isAnnotMode) {
                annotBtn.innerText = "📍 Mode Anotasi: ON";
                annotBtn.className = "btn-toggle";
                crosshairInfo.style.display = "block";
            } else {
                annotBtn.innerText = "📍 Mode Anotasi: OFF";
                annotBtn.className = "btn-toggle off";
                crosshairInfo.style.display = "none";
            }
        });

        // Hapus Semua Anotasi
        clearAnnotBtn.addEventListener('click', () => {
            if (currentPanorama) {
                infospots.forEach(spot => currentPanorama.remove(spot));
                infospots = [];
            }
        });

    </script>
</body>
</html>
